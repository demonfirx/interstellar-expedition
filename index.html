<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e15" />
    <meta name="description" content="Jelajahi tiga objek dari dunia Interstellar dalam arsip 3D interaktif." />
    <title>Interstellar · Arsip Ekspedisi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main class="archive" data-state="intro" data-specimen="array">
      <div class="exhibition" aria-hidden="true">
        <div class="exhibition-backdrop"></div>
        <canvas id="archive-canvas"></canvas>
      </div>

      <header class="archive-header">
        <a class="wordmark" href="/" aria-label="Interstellar, beranda">
          <span class="wordmark-symbol" aria-hidden="true"></span>
          Interstellar<span class="wordmark-period">.</span>
        </a>
        <div class="header-links">
          <a class="voyage-link elden-link" href="/elden.html">Elden <i data-lucide="arrow-up-right"></i></a>
          <a class="voyage-link" href="/voyage.html">Pelayaran <i data-lucide="arrow-up-right"></i></a>
        </div>
      </header>

      <div class="archive-content">
        <section class="archive-intro" aria-labelledby="archive-title">
          <p class="eyebrow"><span class="eyebrow-line"></span> Arsip ekspedisi</p>
          <h1 id="archive-title">Di tepi<br /><em>cakrawala.</em></h1>
          <p class="archive-description">Jelajahi instrumen, kapal layar, dan pusaran cahaya dari dunia Interstellar.</p>
          <div class="archive-actions">
            <button class="enter-button" type="button" id="enter-archive" aria-describedby="enter-hint">
              <span class="enter-fill" aria-hidden="true"></span>
              <span class="button-text">Masuk arsip <i data-lucide="arrow-up-right"></i></span>
            </button>
            <span class="enter-hint" id="enter-hint">Klik atau tahan</span>
          </div>
        </section>

        <section class="exhibit-caption" aria-label="Objek aktif">
          <p class="exhibit-category" id="specimen-category">Instrumen navigasi</p>
          <h2 id="specimen-name" aria-live="polite">Tidal Array</h2>
          <button type="button" class="detail-link" id="show-details">Lihat detail <i data-lucide="plus"></i></button>
        </section>

        <div class="stage-interaction" id="orbit-surface" aria-hidden="true"></div>
        <div class="view-controls" id="view-controls" hidden aria-label="Kontrol tampilan 3D">
          <span class="orbit-hint">Seret objek untuk memutar</span>
          <button id="reset-view" class="icon-button" type="button" aria-label="Atur ulang sudut pandang" title="Atur ulang sudut pandang"><i data-lucide="rotate-ccw"></i></button>
          <button id="pause-view" class="icon-button" type="button" aria-label="Jeda animasi" aria-pressed="false" title="Jeda atau lanjutkan animasi"><i data-lucide="pause"></i></button>
        </div>
      </div>

      <nav class="specimen-nav" aria-label="Pilih objek arsip">
        <button class="specimen-tab" type="button" data-object="0" aria-current="true">
          <span class="specimen-index">01</span><span>Tidal Array</span>
        </button>
        <button class="specimen-tab" type="button" data-object="1">
          <span class="specimen-index">02</span><span>Lumen Sailer</span>
        </button>
        <button class="specimen-tab" type="button" data-object="2">
          <span class="specimen-index">03</span><span>Event Horizon</span>
        </button>
        <div class="specimen-arrows">
          <button class="icon-button" type="button" id="previous-specimen" aria-label="Objek sebelumnya"><i data-lucide="arrow-left"></i></button>
          <button class="icon-button" type="button" id="next-specimen" aria-label="Objek berikutnya"><i data-lucide="arrow-right"></i></button>
        </div>
      </nav>
      <noscript><p class="noscript">Aktifkan JavaScript untuk memilih dan memutar objek arsip.</p></noscript>
    </main>

    <dialog class="artifact-dialog" id="artifact-dialog" aria-labelledby="dialog-title">
      <article class="artifact-card">
        <header class="artifact-header">
          <p class="eyebrow" id="dialog-category"></p>
          <form method="dialog"><button class="icon-button close-dialog" type="submit" aria-label="Tutup detail" autofocus><i data-lucide="x"></i></button></form>
        </header>
        <h2 id="dialog-title"></h2>
        <p class="artifact-story" id="dialog-story"></p>
        <dl id="dialog-notes"></dl>
        <a class="artifact-voyage" href="/voyage.html">Buka pelayaran <i data-lucide="arrow-up-right"></i></a>
      </article>
    </dialog>
    <script type="module" src="/src/archive/main.js"></script>
  </body>
</html>
