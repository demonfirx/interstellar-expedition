<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04040c" />
    <meta
      name="description"
      content="Kapal layar menjelajahi lautan cahaya di bawah cincin black hole yang berkilau lembut."
    />
    <title>Interstellar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main class="universe" aria-label="Pemandangan Interstellar interaktif">
      <canvas
        id="space"
        role="img"
        aria-label="Kamera mengikuti kapal layar dari belakang saat berlayar ke black hole di lautan kosmik. Seret untuk menggeser sudut kamera."
        tabindex="0"
      ></canvas>
      <section
        lang="en"
        class="quote-playground"
        aria-label="Interactive inspirational quotes"
      >
        <p
          class="quote-readable sr-only"
          aria-live="polite"
          aria-atomic="true"
          id="quote-readable"
        ></p>
        <p class="sr-only" id="quote-help">
          Drag a word and release it. Press Enter to scatter the words, Escape
          to reset, or Right Arrow for the next quote. Quotes change
          automatically every 16 seconds and wait while you interact. Use the
          pause control to stop automatic changes.
        </p>
        <div class="quote-drift">
          <div
            class="quote-words"
            role="group"
            tabindex="0"
            aria-label="Play with the quote"
            aria-describedby="quote-readable quote-help"
          ></div>
        </div>
        <div class="quote-controls">
          <button
            data-quote-action="next"
            aria-label="Next quote"
            title="Next quote"
          >
            <i data-lucide="arrow-right"></i>
          </button>
          <button
            data-quote-action="scatter"
            aria-label="Scatter words"
            title="Play with the words"
          >
            <i data-lucide="sparkles"></i>
          </button>
          <button
            data-quote-action="reset"
            aria-label="Reset words"
            title="Reset words"
          >
            <i data-lucide="rotate-ccw"></i>
          </button>
          <button
            data-quote-action="auto"
            aria-label="Pause automatic quotes"
            aria-pressed="true"
            title="Pause automatic quotes"
          >
            <i data-lucide="pause"></i>
          </button>
        </div>
      </section>
      <div class="scene-controls" aria-label="Kontrol pemandangan">
        <button id="motion" aria-label="Jeda animasi" aria-pressed="false">
          <i data-lucide="pause"></i>
        </button>
        <button
          id="sound"
          aria-label="Aktifkan suara ambient"
          aria-pressed="false"
        >
          <i data-lucide="volume-x"></i>
        </button>
        <button id="fullscreen" aria-label="Layar penuh" aria-pressed="false">
          <i data-lucide="maximize"></i>
        </button>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
